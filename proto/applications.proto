syntax = "proto3";

package homeai.applications.v1;

// Application mutations (tenant submits / withdraws). Reads stay
// HTTP-only / direct-DB.

service ApplicationsService {
  rpc SubmitApplication(SubmitApplicationRequest)
      returns (SubmitApplicationResponse);

  rpc WithdrawApplication(WithdrawApplicationRequest)
      returns (BatchResult);
}

message SubmitApplicationRequest {
  string property_id = 1;
  // ISO-8601 date.
  optional string move_in_date = 2;
  optional uint32 lease_term_months = 3;
  optional string additional_notes = 4;
  optional string request_id = 5;
}

message SubmitApplicationResponse {
  string application_id = 1;
  string message = 2;
}

message WithdrawApplicationRequest {
  string application_id = 1;
  optional string request_id = 2;
}

message BatchResult {
  string message = 1;
}
