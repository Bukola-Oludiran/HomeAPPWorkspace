syntax = "proto3";

package homeai.messaging.v1;

// Mutating surface for the messaging module. Reads stay HTTP-only — the AI
// service queries the database directly through its read-only Prisma role.

service MessagingService {
  // POST /messages/conversations equivalent.
  rpc CreateConversation(CreateConversationRequest) returns (Conversation);

  // POST /messages/conversations/:id equivalent.
  rpc SendMessage(SendMessageRequest) returns (Message);
}

message CreateConversationRequest {
  // Other-participant user ids. The authenticated user is automatically
  // added by the service; do not include them here.
  repeated string participant_ids = 1;
  optional string property_id = 2;
  // First message body; if present, the conversation starts with it.
  optional string initial_message = 3;
  optional string request_id = 4;
}

message SendMessageRequest {
  string conversation_id = 1;
  string content = 2;
  // 'TEXT' (default) | 'IMAGE' | 'FILE'.
  optional string message_type = 3;
  repeated string attachment_urls = 4;
  optional string request_id = 5;
}

message UserRef {
  string id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
}

message Conversation {
  string id = 1;
  string type = 2;
  optional string property_id = 3;
  repeated UserRef participants = 4;
  string created_at = 5;
  string updated_at = 6;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string content = 4;
  string message_type = 5;
  repeated string attachments = 6;
  string created_at = 7;
}
