services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: homeai
      POSTGRES_PASSWORD: homeai_dev
      POSTGRES_DB: homeai_dev
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeai -d homeai_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["redis_data:/data"]
  backend:
    build:
      context: .
      dockerfile: PropApp-Backend/core-backend/Dockerfile
    env_file:
      - path: PropApp-Backend/core-backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://homeai:homeai_dev@postgres:5432/homeai_dev?schema=public
      DIRECT_URL: postgresql://homeai:homeai_dev@postgres:5432/homeai_dev?schema=public
      JWT_SECRET: local-development-secret-at-least-32-characters
      GRPC_PORT: 50051
    ports: ["3000:3000", "50051:50051"]
    depends_on:
      postgres: { condition: service_healthy }
  ai:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file:
      - path: ai-service/.env
        required: false
    environment:
      DATABASE_URL: postgresql://homeai:homeai_dev@postgres:5432/homeai_dev?schema=public
      JWT_SECRET: local-development-secret-at-least-32-characters
      CORE_BACKEND_GRPC_HOST: backend
      CORE_BACKEND_GRPC_PORT: 50051
    ports: ["4000:4000"]
    depends_on: [backend]
  frontend:
    build:
      context: .
      dockerfile: PropApp/propapp/Dockerfile
    ports: ["5173:4173"]
    depends_on: [backend, ai]
volumes:
  postgres_data:
  redis_data:
