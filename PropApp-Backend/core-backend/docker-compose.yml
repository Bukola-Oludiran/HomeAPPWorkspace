version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: homeai-postgres
    environment:
      POSTGRES_USER: homeai
      POSTGRES_PASSWORD: homeai_dev
      POSTGRES_DB: homeai_dev
    ports:
      - "5433:5432" # Using 5433 externally to avoid conflict with local postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U homeai -d homeai_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: homeai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
