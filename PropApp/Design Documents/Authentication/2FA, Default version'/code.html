<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PropertyApp - 2FA Verification</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }input::placeholder {
            letter-spacing: 0.5em; 
            opacity: 0.3;
        }
        @media (min-width: 768px) {
            input::placeholder {
                letter-spacing: 0.75em;
            }
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-slate-900 dark:text-white overflow-hidden relative">
<div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCfd-PEtKh8wfVwv2Nv_lj37eZ9jRdRyYDRx85QWBw1HMwbjQnR82kwQR7vbEL91gI0Mg4_MKRcF8MYSEZ_oDcjRoqT3ehC26ehCbSn9ovfB2oY1HURRaxBWaVVx9dsE3hfTy4MbwiRgxDeMujtbcQlnW7cmp95UYA6Q_meh_jE4BI480hICb8JWGINWyOQxV7WHBUsEQonm48r8T-Je62QRwLuiJRfLuErdautDJvGP0kiflta4Sps-6gE1JkzPwQeZU3vOyx0llGe');">
<div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-slate-900/80 to-slate-900/70 dark:from-background-dark/95 dark:via-background-dark/90 dark:to-background-dark/80 backdrop-blur-[4px]"></div>
</div>
<div class="relative z-10 flex flex-col items-center justify-center min-h-screen w-full px-4 sm:px-6 lg:px-8">
<div class="absolute top-6 left-6 md:top-10 md:left-10 flex items-center gap-3">
<div class="size-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">real_estate_agent</span>
</div>
<h2 class="text-white text-xl font-bold leading-tight tracking-[-0.015em]">PropertyApp</h2>
</div>
<div class="w-full max-w-md bg-white/10 dark:bg-[#1a2632]/60 backdrop-blur-xl border border-white/20 dark:border-slate-700 shadow-2xl rounded-3xl p-8 md:p-10 flex flex-col items-center animate-fade-in-up">
<div class="mb-6 flex justify-center">
<div class="size-16 bg-white/10 rounded-full flex items-center justify-center border border-white/10 shadow-inner ring-1 ring-white/5">
<span class="material-symbols-outlined text-primary text-3xl">lock_person</span>
</div>
</div>
<h1 class="text-2xl md:text-3xl font-extrabold text-white mb-3 text-center">Two-Factor Authentication</h1>
<p class="text-slate-200 dark:text-slate-400 text-sm mb-8 font-normal text-center leading-relaxed">
                Enter the 6-digit code from your authenticator app or SMS.
            </p>
<form action="#" class="w-full space-y-6" method="POST">
<div class="relative group">
<label class="sr-only" for="2fa-code">Security Code</label>
<input autocomplete="one-time-code" autofocus="" class="block w-full py-4 px-4 border border-white/10 dark:border-slate-600 rounded-xl bg-white/5 dark:bg-slate-900/50 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-center text-3xl font-bold tracking-[0.5em] md:tracking-[0.75em]" id="2fa-code" inputmode="numeric" maxlength="6" name="2fa-code" pattern="[0-9]*" placeholder="000000" required="" type="text"/>
</div>
<button class="w-full py-3.5 px-4 rounded-xl bg-primary hover:bg-primary/90 text-white font-bold text-lg shadow-lg shadow-primary/25 hover:shadow-primary/40 transition-all transform hover:-translate-y-0.5 active:scale-[0.98]" type="submit">
                    Verify
                </button>
<div class="text-center">
<p class="text-sm text-slate-400">
                        Didn't receive a code? 
                        <a class="text-primary hover:text-primary/80 font-bold ml-1 transition-colors hover:underline" href="#">Resend Code</a>
<span class="ml-1 text-slate-500 font-mono">(0:28)</span>
</p>
</div>
</form>
<div class="relative w-full my-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/10 dark:border-slate-600"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-3 bg-transparent text-slate-400 dark:text-slate-500 text-xs font-medium tracking-wide bg-[#15202b] rounded-full">OR</span>
</div>
</div>
<button class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-transparent hover:bg-white/5 border border-slate-600/50 hover:border-slate-500 text-slate-300 hover:text-white transition-all font-semibold text-sm group">
<span class="material-symbols-outlined text-[20px] text-slate-400 group-hover:text-white transition-colors">phonelink_lock</span>
                Use another method
            </button>
<div class="mt-6">
<a class="text-slate-400 hover:text-white text-sm font-medium flex items-center gap-1.5 transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
<div class="absolute bottom-8 right-6 md:right-10 flex items-center justify-end">
<div class="group flex items-center gap-3 bg-white/90 dark:bg-[#1a2632]/90 backdrop-blur-xl border border-white/20 dark:border-slate-700 shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-full pl-4 pr-2 py-2 cursor-pointer hover:scale-105 transition-all">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-200 mr-2">Trouble with 2FA?</span>
<div class="size-8 rounded-full bg-primary flex items-center justify-center text-white shadow-md group-hover:bg-primary/90">
<span class="material-symbols-outlined icon-filled text-[18px]">smart_toy</span>
</div>
</div>
</div>
</div>

</body></html>
