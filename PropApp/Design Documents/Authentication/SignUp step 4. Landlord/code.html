<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PropertyApp - Landlord Profile Setup</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.icon-filled {
    font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24
    }.custom-checkbox:checked {
    background-color: #137fec;
    border-color: #137fec;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCR6hXfiH9fBjJ2Q0pf8xZRk8J790RavcMjMMoRcdzF7EyopheowrstD559jhm-Vd8KWcKSIQ69iz-nVmeSyMVU_BmTrxlCi_S5I3U3RSKsAye7EHbJ3uGjnirAOOAvjKnsh_nDL2lcotAYW9IWdVKtIEmhyBEKXjkmVkXqRn4VjnpjhgwZUI_8mxpQIg6rNhAoVtFwvpMnd0I84vS3tyClbOTzrm2v1cDXcDcsNIGUPQXrFhb4Xhu0vIm5td25Yw4cO0h8JWd1yT84)
    }.custom-radio:checked {
    border-color: #137fec;
    color: #137fec;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCE0A3PbMs4v2X5mozw9HwGzFOJ634ujQ_i3ajB5CfP1Q7f2FEMB4xjQJPzlBTTQ_pWRteLkfD70gvtZZ_7Z-_PP4RKbAEwBxC2S0uRkFHgIydnTWCL7qnxCG-CyxeeDAaQeVw75PziBRI7g53y3hvD6li2Yzgp4zbbMiYAMSvBfHrnfDjXOmMfBtwENTvaLE2CLzNa3MZC8SUGPv_2FPGFTk_mymEDxMcIGuCOxps0CIUTR45d8YCKNDXDgzV51Uwvi1A04eanoFUm)
    }input[type="radio"]:checked + div, input[type="checkbox"]:checked + div {
    border-color: #137fec;
    background-color: rgba(19, 127, 236, 0.1)
    }</style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-slate-900 dark:text-white overflow-hidden relative">
<div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCfd-PEtKh8wfVwv2Nv_lj37eZ9jRdRyYDRx85QWBw1HMwbjQnR82kwQR7vbEL91gI0Mg4_MKRcF8MYSEZ_oDcjRoqT3ehC26ehCbSn9ovfB2oY1HURRaxBWaVVx9dsE3hfTy4MbwiRgxDeMujtbcQlnW7cmp95UYA6Q_meh_jE4BI480hICb8JWGINWyOQxV7WHBUsEQonm48r8T-Je62QRwLuiJRfLuErdautDJvGP0kiflta4Sps-6gE1JkzPwQeZU3vOyx0llGe');">
<div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-slate-900/80 to-slate-900/70 dark:from-background-dark/95 dark:via-background-dark/90 dark:to-background-dark/80 backdrop-blur-[2px]"></div>
</div>
<div class="relative z-10 flex flex-col items-center justify-center min-h-screen w-full px-4 sm:px-6 lg:px-8 py-10">
<div class="absolute top-6 left-6 md:top-10 md:left-10 flex items-center gap-3">
<div class="size-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">real_estate_agent</span>
</div>
<h2 class="text-white text-xl font-bold leading-tight tracking-[-0.015em]">PropertyApp</h2>
</div>
<div class="w-full max-w-3xl bg-white/10 dark:bg-[#1a2632]/40 backdrop-blur-xl border border-white/20 dark:border-slate-700 shadow-2xl rounded-3xl p-8 md:p-10 flex flex-col animate-fade-in-up my-4 overflow-y-auto max-h-[85vh] scrollbar-hide">
<div class="flex items-center justify-center mb-6">
<span class="px-3 py-1 rounded-full bg-primary/20 border border-primary/30 text-primary text-xs font-bold uppercase tracking-wider">
                    Step 4 of 4
                </span>
</div>
<h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2 text-center">Start Managing Your Portfolio</h1>
<p class="text-slate-300 text-sm md:text-base mb-8 text-center font-normal">
                Help us tailor your dashboard by sharing a few details about your properties.
            </p>
<form class="w-full flex flex-col gap-8">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-200" for="property-count">How many properties do you currently manage?</label>
<div class="relative">
<select class="block w-full rounded-xl border-white/10 bg-white/5 px-4 py-3.5 text-white placeholder-slate-400 focus:border-primary focus:ring-primary sm:text-sm shadow-sm transition-colors appearance-none" id="property-count" name="property-count">
<option class="bg-slate-800" value="">Select number of properties...</option>
<option class="bg-slate-800" value="1">1 property</option>
<option class="bg-slate-800" value="2-5">2-5 properties</option>
<option class="bg-slate-800" value="6-20">6-20 properties</option>
<option class="bg-slate-800" value="21-50">21-50 properties</option>
<option class="bg-slate-800" value="50+">50+ properties</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col gap-3">
<label class="text-sm font-semibold text-slate-200">Types of properties you manage</label>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
<label class="cursor-pointer group relative">
<input class="sr-only peer" name="property_type" type="checkbox" value="residential"/>
<div class="flex items-center gap-3 p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 peer-checked:ring-1 peer-checked:ring-primary">
<div class="flex-shrink-0 size-5 rounded border border-slate-500 bg-transparent flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
<span class="hidden peer-checked:block text-white material-symbols-outlined text-[16px]">check</span>
</div>
<span class="text-white font-medium text-sm">Residential</span>
</div>
</label>
<label class="cursor-pointer group relative">
<input class="sr-only peer" name="property_type" type="checkbox" value="commercial"/>
<div class="flex items-center gap-3 p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 peer-checked:ring-1 peer-checked:ring-primary">
<div class="flex-shrink-0 size-5 rounded border border-slate-500 bg-transparent flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
<span class="hidden peer-checked:block text-white material-symbols-outlined text-[16px]">check</span>
</div>
<span class="text-white font-medium text-sm">Commercial</span>
</div>
</label>
<label class="cursor-pointer group relative">
<input class="sr-only peer" name="property_type" type="checkbox" value="mixed"/>
<div class="flex items-center gap-3 p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 peer-checked:ring-1 peer-checked:ring-primary">
<div class="flex-shrink-0 size-5 rounded border border-slate-500 bg-transparent flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
<span class="hidden peer-checked:block text-white material-symbols-outlined text-[16px]">check</span>
</div>
<span class="text-white font-medium text-sm">Mixed-use</span>
</div>
</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-3">
<label class="text-sm font-semibold text-slate-200">Your role</label>
<div class="flex flex-col gap-2">
<label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-white/5 transition-colors">
<input class="custom-radio w-5 h-5 bg-transparent border-slate-500 focus:ring-primary focus:ring-offset-0 text-primary" name="role" type="radio" value="owner"/>
<span class="text-slate-300 text-sm">Property Owner</span>
</label>
<label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-white/5 transition-colors">
<input class="custom-radio w-5 h-5 bg-transparent border-slate-500 focus:ring-primary focus:ring-offset-0 text-primary" name="role" type="radio" value="manager"/>
<span class="text-slate-300 text-sm">Property Manager</span>
</label>
</div>
</div>
<div class="flex flex-col gap-3">
<label class="text-sm font-semibold text-slate-200">Are you listing a property soon?</label>
<div class="flex flex-col gap-2">
<label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-white/5 transition-colors">
<input class="custom-radio w-5 h-5 bg-transparent border-slate-500 focus:ring-primary focus:ring-offset-0 text-primary" name="listing_intent" type="radio" value="yes"/>
<span class="text-slate-300 text-sm">Yes, within 30 days</span>
</label>
<label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-white/5 transition-colors">
<input class="custom-radio w-5 h-5 bg-transparent border-slate-500 focus:ring-primary focus:ring-offset-0 text-primary" name="listing_intent" type="radio" value="no"/>
<span class="text-slate-300 text-sm">No, just exploring</span>
</label>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="text-sm font-semibold text-slate-200">Preferred contact method for tenants</label>
<span class="text-xs text-slate-400 bg-white/5 px-2 py-0.5 rounded">Optional</span>
</div>
<div class="grid grid-cols-3 gap-3">
<label class="cursor-pointer group relative text-center">
<input class="sr-only peer" name="contact_pref" type="radio" value="chat"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 peer-checked:ring-1 peer-checked:ring-primary peer-checked:bg-primary/10">
<span class="material-symbols-outlined text-slate-400 mb-1 peer-checked:text-primary">chat</span>
<span class="text-slate-300 text-xs font-medium peer-checked:text-white">App Chat</span>
</div>
</label>
<label class="cursor-pointer group relative text-center">
<input class="sr-only peer" name="contact_pref" type="radio" value="email"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 peer-checked:ring-1 peer-checked:ring-primary peer-checked:bg-primary/10">
<span class="material-symbols-outlined text-slate-400 mb-1 peer-checked:text-primary">mail</span>
<span class="text-slate-300 text-xs font-medium peer-checked:text-white">Email</span>
</div>
</label>
<label class="cursor-pointer group relative text-center">
<input class="sr-only peer" name="contact_pref" type="radio" value="phone"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 peer-checked:ring-1 peer-checked:ring-primary peer-checked:bg-primary/10">
<span class="material-symbols-outlined text-slate-400 mb-1 peer-checked:text-primary">phone_in_talk</span>
<span class="text-slate-300 text-xs font-medium peer-checked:text-white">Phone</span>
</div>
</label>
</div>
</div>
<div class="pt-4">
<button class="w-full py-3.5 px-4 rounded-xl bg-primary hover:bg-primary/90 text-white font-bold text-lg shadow-lg shadow-primary/25 hover:shadow-primary/40 transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2" type="button">
                        Finish Setup
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</form>
</div>
<div class="fixed bottom-8 right-6 md:right-10 flex items-center justify-end z-50">
<div class="group flex items-center gap-3 bg-white/90 dark:bg-[#1a2632]/90 backdrop-blur-xl border border-white/20 dark:border-slate-700 shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-full pl-5 pr-2 py-2.5 cursor-pointer hover:scale-105 transition-all">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-200 mr-2 max-w-[200px] sm:max-w-none truncate">Learn about property management tools</span>
<div class="size-8 rounded-full bg-primary flex items-center justify-center text-white shadow-md group-hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined icon-filled text-[18px]">smart_toy</span>
</div>
</div>
</div>
</div>
</body></html>
