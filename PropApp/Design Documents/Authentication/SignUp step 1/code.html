<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PropertyApp - Create Account</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }input[type="checkbox"]:checked {
            background-color: #137fec;
            border-color: transparent;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-slate-900 dark:text-white overflow-hidden relative">
<div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCfd-PEtKh8wfVwv2Nv_lj37eZ9jRdRyYDRx85QWBw1HMwbjQnR82kwQR7vbEL91gI0Mg4_MKRcF8MYSEZ_oDcjRoqT3ehC26ehCbSn9ovfB2oY1HURRaxBWaVVx9dsE3hfTy4MbwiRgxDeMujtbcQlnW7cmp95UYA6Q_meh_jE4BI480hICb8JWGINWyOQxV7WHBUsEQonm48r8T-Je62QRwLuiJRfLuErdautDJvGP0kiflta4Sps-6gE1JkzPwQeZU3vOyx0llGe');">
<div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-slate-900/80 to-slate-900/70 dark:from-background-dark/95 dark:via-background-dark/90 dark:to-background-dark/80 backdrop-blur-[2px]"></div>
</div>
<div class="relative z-10 flex flex-col items-center justify-center min-h-screen w-full px-4 sm:px-6 lg:px-8 py-10">
<div class="absolute top-6 left-6 md:top-10 md:left-10 flex items-center gap-3">
<div class="size-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">real_estate_agent</span>
</div>
<h2 class="text-white text-xl font-bold leading-tight tracking-[-0.015em]">PropertyApp</h2>
</div>
<div class="w-full max-w-lg bg-white/10 dark:bg-[#1a2632]/40 backdrop-blur-xl border border-white/20 dark:border-slate-700 shadow-2xl rounded-3xl p-8 md:p-10 flex flex-col items-center animate-fade-in-up">
<div class="flex items-center gap-2 mb-6">
<span class="px-3 py-1 rounded-full bg-primary/20 border border-primary/30 text-primary text-xs font-bold uppercase tracking-wider">
                    Step 1 of 3
                </span>
</div>
<h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2 text-center">Create Your Account</h1>
<p class="text-slate-300 text-sm md:text-base mb-8 text-center font-normal">
                Start your journey to finding the perfect property.
            </p>
<form class="w-full space-y-5">
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-slate-200" for="email">Email Address</label>
<div class="relative">
<input class="block w-full rounded-xl border-white/10 bg-white/5 px-4 py-3.5 text-white placeholder-slate-400 focus:border-primary focus:ring-primary sm:text-sm shadow-sm transition-colors" id="email" name="email" placeholder="name@example.com" type="email"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-xl">mail</span>
</div>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-slate-200" for="password">Password</label>
<div class="relative">
<input class="block w-full rounded-xl border-white/10 bg-white/5 px-4 py-3.5 text-white placeholder-slate-400 focus:border-primary focus:ring-primary sm:text-sm shadow-sm transition-colors" id="password" name="password" placeholder="Create a secure password" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-white transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
<div class="pt-2 grid grid-cols-1 sm:grid-cols-2 gap-y-2 gap-x-4">
<div class="flex items-center gap-2 text-xs text-slate-400 transition-colors duration-300">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span>8 characters minimum</span>
</div>
<div class="flex items-center gap-2 text-xs text-slate-400 transition-colors duration-300">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span>One uppercase letter</span>
</div>
<div class="flex items-center gap-2 text-xs text-slate-400 transition-colors duration-300">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span>One number</span>
</div>
</div>
</div>
<div class="flex items-start gap-3 pt-2">
<div class="flex h-6 items-center">
<input class="h-5 w-5 rounded border-white/20 bg-white/5 text-primary focus:ring-primary focus:ring-offset-0 cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<div class="text-sm leading-6">
<label class="font-medium text-slate-300" for="terms">
                            I agree to the <a class="font-semibold text-primary hover:text-primary/80 underline decoration-primary/30 underline-offset-2" href="#">Terms of Service</a> and <a class="font-semibold text-primary hover:text-primary/80 underline decoration-primary/30 underline-offset-2" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<button class="w-full mt-4 py-3.5 px-4 rounded-xl bg-primary hover:bg-primary/90 text-white font-bold text-lg shadow-lg shadow-primary/25 hover:shadow-primary/40 transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2" type="button">
                    Create Account
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<p class="mt-8 text-sm text-slate-300">
                Already have an account? 
                <a class="font-bold text-white hover:text-primary transition-colors" href="#">Log In</a>
</p>
</div>
<div class="fixed bottom-8 right-6 md:right-10 flex items-center justify-end z-50">
<div class="group flex items-center gap-3 bg-white/90 dark:bg-[#1a2632]/90 backdrop-blur-xl border border-white/20 dark:border-slate-700 shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-full pl-5 pr-2 py-2.5 cursor-pointer hover:scale-105 transition-all">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-200 mr-2 max-w-[200px] sm:max-w-none truncate">Need help with password best practices?</span>
<div class="size-8 rounded-full bg-primary flex items-center justify-center text-white shadow-md group-hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined icon-filled text-[18px]">smart_toy</span>
</div>
</div>
</div>
</div>

</body></html>
