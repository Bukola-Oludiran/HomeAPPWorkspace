<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PropertyApp - Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-slate-900 dark:text-white overflow-hidden relative">
<div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCfd-PEtKh8wfVwv2Nv_lj37eZ9jRdRyYDRx85QWBw1HMwbjQnR82kwQR7vbEL91gI0Mg4_MKRcF8MYSEZ_oDcjRoqT3ehC26ehCbSn9ovfB2oY1HURRaxBWaVVx9dsE3hfTy4MbwiRgxDeMujtbcQlnW7cmp95UYA6Q_meh_jE4BI480hICb8JWGINWyOQxV7WHBUsEQonm48r8T-Je62QRwLuiJRfLuErdautDJvGP0kiflta4Sps-6gE1JkzPwQeZU3vOyx0llGe');">
<div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-slate-900/80 to-slate-900/70 dark:from-background-dark/95 dark:via-background-dark/90 dark:to-background-dark/80 backdrop-blur-[4px]"></div>
</div>
<div class="relative z-10 flex flex-col items-center justify-center min-h-screen w-full px-4 sm:px-6 lg:px-8">
<div class="absolute top-6 left-6 md:top-10 md:left-10 flex items-center gap-3">
<div class="size-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">real_estate_agent</span>
</div>
<h2 class="text-white text-xl font-bold leading-tight tracking-[-0.015em]">PropertyApp</h2>
</div>
<div class="w-full max-w-md bg-white/10 dark:bg-[#1a2632]/60 backdrop-blur-xl border border-white/20 dark:border-slate-700 shadow-2xl rounded-3xl p-8 md:p-10 flex flex-col items-center animate-fade-in-up">
<h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2">Welcome Back</h1>
<p class="text-slate-200 dark:text-slate-400 text-sm mb-8 font-normal">
            Log in to your account to continue
        </p>
<form action="#" class="w-full space-y-5" method="POST">
<div class="relative">
<label class="sr-only" for="email">Email address</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3.5 border border-white/10 dark:border-slate-600 rounded-xl bg-white/5 dark:bg-slate-900/50 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm" id="email" name="email" placeholder="Email address" required="" type="email"/>
</div>
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3.5 border border-white/10 dark:border-slate-600 rounded-xl bg-white/5 dark:bg-slate-900/50 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm" id="password" name="password" placeholder="Password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-slate-400 hover:text-white transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-white/20 dark:border-slate-600 rounded bg-white/10 dark:bg-slate-800" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-slate-300 select-none" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<button class="w-full py-3.5 px-4 rounded-xl bg-primary hover:bg-primary/90 text-white font-bold text-lg shadow-lg shadow-primary/25 hover:shadow-primary/40 transition-all transform hover:-translate-y-0.5" type="submit">
                Log In
            </button>
</form>
<div class="relative w-full my-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/10 dark:border-slate-600"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-transparent text-slate-300 dark:text-slate-500 text-xs uppercase font-medium tracking-wide">Or continue with</span>
</div>
</div>
<div class="flex gap-4 w-full">
<button class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-white text-slate-900 hover:bg-slate-50 border border-slate-200 shadow-sm transition-all font-semibold text-sm">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMIPoePMDajF4AS4iDsM0Vqp3-4XdvoQ1s2-NVjbLkeQBAGxsjW_P-WB1SG7GgqXB7yRG_PIy9GaVZ00B1kRRzJIOqJPn_hCw8_iFvARH3iksBKtAogs5nPEdaM6btjf-E4G-IeXiK9wPplBA0gNP8FL_GoQ8e6eyktTTQ1Mc-MDfjknZise8fPXmSJDro0KOvfoba_KsUs2RnVZye2Jh49rv9W2C_Z74uNOgpKTuPLb3_VZ9yHnEXJngFtac0BQIN62fv0bFWkAMC"/>
                Google
            </button>
<button class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-black text-white hover:bg-slate-900 border border-slate-800 shadow-sm transition-all font-semibold text-sm">
<span class="material-symbols-outlined text-[20px]">ios</span>
                Apple
            </button>
</div>
<p class="mt-8 text-sm text-slate-300">
            Don't have an account? <a class="text-primary hover:text-primary/80 font-bold hover:underline transition-all" href="#">Sign Up</a>
</p>
</div>
<div class="absolute bottom-8 right-6 md:right-10 flex items-center justify-end">
<div class="group flex items-center gap-3 bg-white/90 dark:bg-[#1a2632]/90 backdrop-blur-xl border border-white/20 dark:border-slate-700 shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-full pl-4 pr-2 py-2 cursor-pointer hover:scale-105 transition-all">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-200 mr-2">Trouble logging in?</span>
<div class="size-8 rounded-full bg-primary flex items-center justify-center text-white shadow-md group-hover:bg-primary/90">
<span class="material-symbols-outlined icon-filled text-[18px]">smart_toy</span>
</div>
</div>
</div>
</div>

</body></html>
